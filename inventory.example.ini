# Inventory 主机清单示例
# 使用：复制为 /etc/ansible/hosts 或通过 -i 指定本文件
# ansible webservers -m ping -i inventory.example.yml

[webservers]
192.168.1.11 ansible_user=ubuntu ansible_port=22
192.168.1.12 ansible_user=ubuntu ansible_port=22

# 全局连接参数（也可放在 [all:vars]）
[all:vars]
ansible_ssh_private_key_file=~/.ssh/id_rsa
ansible_python_interpreter=/usr/bin/python3